<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PrintKiosk</title>
<style>
  :root{
    --bg:#0b1020;
    --bg-2:#121a33;
    --panel:#18203c;
    --panel-2:#1e2949;
    --line:#2b3760;
    --ink:#eaf0ff;
    --ink-dim:#93a1c9;
    --accent:#3ddc97;
    --accent-ink:#06301f;
    --danger:#ff5f6d;
    --warn:#ffc857;
    --radius:18px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:radial-gradient(1200px 700px at 50% -10%, var(--bg-2), var(--bg)) fixed;
    color:var(--ink);
    font:16px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    user-select:none; -webkit-user-select:none;
    overflow:hidden; touch-action:manipulation;
  }
  body.kiosk-cursorless{cursor:none;}

  .screen{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none;
    transition:opacity .28s ease;
  }
  .screen.active{opacity:1; pointer-events:auto;}

  /* ------------------------------- top bar ------------------------------- */
  header{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:14px 22px;
    border-bottom:1px solid var(--line);
    background:rgba(10,15,32,.6);
  }
  .brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.06em;}
  .brand svg{width:26px;height:26px;flex:0 0 auto;}
  .brand span{font-size:15px;}
  .brand b{color:var(--accent);}
  .status{display:flex;align-items:center;gap:18px;font-size:13px;color:var(--ink-dim);}
  .pill{display:flex;align-items:center;gap:8px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-dim);flex:0 0 auto;}
  .dot.ok{background:var(--accent);box-shadow:0 0 0 4px rgba(61,220,151,.16);}
  .dot.sim{background:var(--warn);box-shadow:0 0 0 4px rgba(255,200,87,.16);}
  .dot.bad{background:var(--danger);box-shadow:0 0 0 4px rgba(255,95,109,.16);}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

  /* -------------------------------- keypad ------------------------------- */
  .pad-wrap{
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(12px,2.2vh,26px); padding:clamp(10px,2vh,24px);
  }
  h1{margin:0;font-size:clamp(19px,3.2vh,28px);font-weight:650;letter-spacing:-.01em;text-align:center;}
  .sub{margin:0;color:var(--ink-dim);font-size:clamp(12px,1.8vh,15px);text-align:center;}

  .cells{display:flex;gap:clamp(8px,1.4vw,14px);}
  .cell{
    width:clamp(44px,7.6vw,68px); height:clamp(58px,10vh,88px);
    border-radius:14px; border:2px solid var(--line);
    background:var(--panel);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(26px,4.6vh,40px); font-weight:700;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    transition:border-color .15s, background .15s, transform .12s;
  }
  .cell.filled{border-color:var(--accent);background:var(--panel-2);}
  .cell.caret{border-color:var(--accent);animation:caret 1.1s ease-in-out infinite;}
  @keyframes caret{0%,100%{border-color:var(--line);}50%{border-color:var(--accent);}}

  .cells.shake{animation:shake .4s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-11px);} 40%{transform:translateX(9px);}
    60%{transform:translateX(-6px);} 80%{transform:translateX(4px);}
  }
  .cells.error .cell{border-color:var(--danger);}

  .msg{min-height:22px;font-size:clamp(12px,1.9vh,15px);text-align:center;color:var(--ink-dim);padding:0 16px;}
  .msg.error{color:var(--danger);}

  .keys{
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:clamp(8px,1.4vh,14px);
    width:min(92vw,430px);
  }
  .key{
    appearance:none; border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    color:var(--ink);
    font-size:clamp(22px,3.6vh,32px); font-weight:650;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    height:clamp(56px,9.2vh,84px);
    border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;
    transition:transform .07s ease, background .12s, border-color .12s;
  }
  .key:active{transform:scale(.95);background:var(--panel-2);border-color:var(--accent);}
  .key.util{font-size:clamp(13px,2vh,17px);color:var(--ink-dim);font-family:inherit;font-weight:600;}
  .key.util:active{color:var(--ink);}
  .key svg{width:26px;height:26px;}

  .submit{
    appearance:none;border:0;border-radius:var(--radius);
    width:min(92vw,430px); height:clamp(54px,8.6vh,76px);
    font-size:clamp(15px,2.4vh,20px); font-weight:750; letter-spacing:.02em;
    background:var(--accent); color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;gap:10px;
    transition:transform .07s, opacity .18s, filter .18s;
  }
  .submit:disabled{opacity:.28;filter:grayscale(.6);}
  .submit:not(:disabled):active{transform:scale(.98);}
  .submit svg{width:22px;height:22px;}

  /* ------------------------------ job screen ----------------------------- */
  .job{
    flex:1 1 auto; min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,2vh,22px); padding:clamp(14px,3vh,34px); text-align:center;
  }
  .printer-art{width:clamp(120px,22vh,190px);height:auto;}
  .sheet{transform-origin:center; animation:feed 2.4s ease-in-out infinite;}
  @keyframes feed{
    0%{transform:translateY(6px);opacity:0;}
    30%{opacity:1;}
    100%{transform:translateY(-22px);opacity:1;}
  }
  .paused .sheet{animation:none;transform:translateY(-22px);}

  .stage{font-size:clamp(18px,3vh,26px);font-weight:650;}
  .stage-msg{color:var(--ink-dim);font-size:clamp(13px,2vh,16px);min-height:20px;}

  .bar{
    width:min(92vw,520px); height:14px; border-radius:99px;
    background:var(--panel); border:1px solid var(--line); overflow:hidden;
  }
  .bar i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,#2fb3ff,var(--accent));
    border-radius:99px; transition:width .45s ease;
  }
  .bar.err i{background:linear-gradient(90deg,#ff8a5f,var(--danger));}
  .pct{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--ink-dim);}

  .summary{
    width:min(92vw,520px);
    border:1px solid var(--line); border-radius:var(--radius);
    background:var(--panel); overflow:hidden;
  }
  .summary div{
    display:flex;justify-content:space-between;gap:14px;
    padding:9px 16px; font-size:clamp(12px,1.85vh,14px);
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .summary div:last-child{border-bottom:0;}
  .summary dt{color:var(--ink-dim);}
  .summary dd{margin:0;font-weight:600;}

  .big-icon{width:clamp(66px,12vh,104px);height:auto;}
  .headline{font-size:clamp(22px,4vh,34px);font-weight:750;}
  .headline.ok{color:var(--accent);}
  .headline.bad{color:var(--danger);}

  .ghost{
    appearance:none;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);border-radius:var(--radius);
    padding:0 26px;height:clamp(48px,7.4vh,64px);
    font-size:clamp(14px,2.2vh,17px);font-weight:650;
  }
  .ghost:active{transform:scale(.98);border-color:var(--accent);}
  .countdown{color:var(--ink-dim);font-size:13px;}

  footer{
    flex:0 0 auto;padding:10px 22px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;color:var(--ink-dim);font-size:12px;
  }
  a.tiny{color:var(--ink-dim);text-decoration:none;}

  @media (max-height:520px){
    header,footer{padding-top:7px;padding-bottom:7px;}
    .brand span{display:none;}
  }
</style>
</head>
<body>

<!-- ============================ KEYPAD SCREEN ============================ -->
<section class="screen active" id="screen-pad">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 17h12v4H6z"/>
      </svg>
      <span>PRINT<b>KIOSK</b></span>
    </div>
    <div class="status">
      <div class="pill"><i class="dot" id="dot-printer"></i><span id="printer-label">connecting…</span></div>
      <div class="pill mono" id="clock">--:--</div>
    </div>
  </header>

  <div class="pad-wrap">
    <h1>Enter your pickup code</h1>
    <p class="sub">The 6-digit code shown after payment</p>

    <div class="cells" id="cells" aria-label="pickup code"></div>
    <div class="msg" id="msg"></div>

    <div class="keys" id="keys"></div>

    <button class="submit" id="btn-release" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 17h12v4H6z"/>
      </svg>
      RELEASE MY PRINTOUT
    </button>
  </div>

  <footer>
    <span id="kiosk-id" class="mono">kiosk</span>
    <span>Need help? Contact the library desk</span>
  </footer>
</section>

<!-- =========================== PRINTING SCREEN =========================== -->
<section class="screen" id="screen-job">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 17h12v4H6z"/>
      </svg>
      <span>PRINT<b>KIOSK</b></span>
    </div>
    <div class="status"><div class="pill mono" id="job-order">—</div></div>
  </header>

  <div class="job" id="job-body">
    <svg class="printer-art" id="printer-art" viewBox="0 0 120 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect class="sheet" x="38" y="16" width="44" height="30" rx="3" fill="#18203c" stroke="#3ddc97"/>
      <rect x="18" y="44" width="84" height="34" rx="6" fill="#18203c" stroke="#93a1c9"/>
      <circle cx="90" cy="54" r="3.4" fill="#3ddc97" stroke="none"/>
      <rect x="34" y="72" width="52" height="20" rx="3" fill="#121a33" stroke="#93a1c9"/>
    </svg>

    <div class="stage" id="job-stage">Starting…</div>
    <div class="stage-msg" id="job-msg">&nbsp;</div>

    <div class="bar" id="job-bar"><i></i></div>
    <div class="pct" id="job-pct">0%</div>

    <dl class="summary" id="job-summary"></dl>
  </div>

  <footer><span class="mono" id="job-driver">—</span><span>Please wait at the kiosk</span></footer>
</section>

<!-- ============================ RESULT SCREEN ============================ -->
<section class="screen" id="screen-done">
  <div class="job">
    <svg class="big-icon" id="done-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/>
    </svg>
    <div class="headline" id="done-title">Done</div>
    <div class="stage-msg" id="done-msg">&nbsp;</div>
    <dl class="summary" id="done-summary"></dl>
    <button class="ghost" id="btn-next">Next customer</button>
    <div class="countdown" id="done-count">&nbsp;</div>
  </div>
</section>

<script>
(() => {
  'use strict';

  const OTP_LEN = 6;
  const $ = (id) => document.getElementById(id);

  const state = {
    otp: '',
    busy: false,
    jobId: null,
    es: null,
    resetTimer: null,
    countTimer: null,
    idleTimer: null,
    resetDelayMs: 20000,
  };

  /* ------------------------------ screens ------------------------------- */

  function show(name) {
    for (const s of document.querySelectorAll('.screen')) s.classList.remove('active');
    $('screen-' + name).classList.add('active');
  }

  /* ------------------------------- keypad ------------------------------- */

  const cellsEl = $('cells');
  for (let i = 0; i < OTP_LEN; i += 1) {
    const c = document.createElement('div');
    c.className = 'cell';
    cellsEl.appendChild(c);
  }

  function renderCells() {
    const cells = cellsEl.children;
    for (let i = 0; i < OTP_LEN; i += 1) {
      const filled = i < state.otp.length;
      cells[i].textContent = filled ? state.otp[i] : '';
      cells[i].classList.toggle('filled', filled);
      cells[i].classList.toggle('caret', !state.busy && i === state.otp.length);
    }
    $('btn-release').disabled = state.busy || state.otp.length !== OTP_LEN;
  }

  function setMsg(text, isError) {
    const el = $('msg');
    el.textContent = text || '';
    el.classList.toggle('error', Boolean(isError));
  }

  function rejectInput(text) {
    setMsg(text, true);
    cellsEl.classList.add('shake', 'error');
    setTimeout(() => cellsEl.classList.remove('shake'), 420);
    setTimeout(() => {
      cellsEl.classList.remove('error');
      state.otp = '';
      renderCells();
    }, 900);
  }

  function press(value) {
    if (state.busy) return;
    bumpIdle();

    if (value === 'clear') {
      state.otp = '';
      setMsg('');
    } else if (value === 'back') {
      state.otp = state.otp.slice(0, -1);
      setMsg('');
    } else if (/^[0-9]$/.test(value) && state.otp.length < OTP_LEN) {
      state.otp += value;
      setMsg('');
    }
    renderCells();
  }

  const BACKSPACE_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/>' +
    '<path d="m18 9-6 6M12 9l6 6"/></svg>';

  const layout = ['1','2','3','4','5','6','7','8','9','clear','0','back'];
  const keysEl = $('keys');
  for (const k of layout) {
    const b = document.createElement('button');
    b.className = 'key' + (k === 'clear' || k === 'back' ? ' util' : '');
    b.dataset.k = k;
    b.type = 'button';
    if (k === 'clear') b.textContent = 'CLEAR';
    else if (k === 'back') b.innerHTML = BACKSPACE_SVG;
    else b.textContent = k;
    keysEl.appendChild(b);
  }

  keysEl.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('.key');
    if (btn) press(btn.dataset.k);
  });

  document.addEventListener('keydown', (e) => {
    if (!$('screen-pad').classList.contains('active')) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('back');
    else if (e.key === 'Escape' || e.key === 'Delete') press('clear');
    else if (e.key === 'Enter') submit();
  });

  $('btn-release').addEventListener('click', submit);

  /* ------------------------------- submit -------------------------------- */

  async function submit() {
    if (state.busy || state.otp.length !== OTP_LEN) return;
    state.busy = true;
    renderCells();
    setMsg('Verifying…');

    let res, data;
    try {
      res = await fetch('/api/kiosk/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otp: state.otp }),
      });
      data = await res.json();
    } catch {
      state.busy = false;
      rejectInput('Kiosk offline. Please tell the desk staff.');
      return;
    }

    if (!res.ok || !data.ok) {
      state.busy = false;
      renderCells();
      let text = data.message || 'Verification failed.';
      if (data.code === 'LOCKED_OUT' && data.retryAfterMs) {
        const secs = Math.ceil(data.retryAfterMs / 1000);
        text = 'Too many wrong attempts. Try again in ' +
               (secs < 60 ? secs + ' seconds.' : Math.ceil(secs / 60) + ' min.');
      } else if (typeof data.remaining === 'number' && data.remaining > 0 && data.code === 'INVALID') {
        text += ' ' + data.remaining + ' attempt' + (data.remaining === 1 ? '' : 's') + ' left.';
      }
      rejectInput(text);
      return;
    }

    state.otp = '';
    renderCells();
    setMsg('');
    beginJob(data);
  }

  /* -------------------------------- job ---------------------------------- */

  function summaryRows(s) {
    if (!s) return [];
    return [
      ['Order', s.orderId],
      ['Document', s.file],
      ['Pages', s.pages + ' page' + (s.pages === 1 ? '' : 's')],
      ['Copies', String(s.copies)],
      ['Sides', s.duplex ? 'Double-sided' : 'Single-sided'],
      ['Colour', s.colourMode === 'colour' ? 'Colour' : 'Black & white'],
      ['Paper', s.paperSize],
      ['Sheets', String(s.sheets)],
      ['Paid', 'Rs. ' + s.amount],
    ];
  }

  function fillSummary(el, s) {
    el.innerHTML = '';
    for (const [k, v] of summaryRows(s)) {
      const row = document.createElement('div');
      const dt = document.createElement('dt');
      const dd = document.createElement('dd');
      dt.textContent = k;
      dd.textContent = v;
      row.append(dt, dd);
      el.appendChild(row);
    }
  }

  function beginJob(snap) {
    state.jobId = snap.jobId;
    clearIdle();
    show('job');
    $('job-order').textContent = snap.orderId || '';
    $('job-driver').textContent = snap.driver ? 'driver: ' + snap.driver : '';
    $('printer-art').classList.remove('paused');
    fillSummary($('job-summary'), snap.summary);
    paint(snap);

    if (state.es) state.es.close();
    state.es = new EventSource('/api/jobs/' + snap.jobId + '/events');
    state.es.onmessage = (ev) => {
      let s;
      try { s = JSON.parse(ev.data); } catch { return; }
      paint(s);
      if (s.done) {
        state.es.close();
        state.es = null;
        finish(s);
      }
    };
    state.es.onerror = () => {
      // SSE dropped: fall back to polling so the screen never freezes.
      if (state.es) { state.es.close(); state.es = null; }
      pollJob();
    };
  }

  const STAGE_TEXT = {
    VERIFIED: 'Code accepted',
    FETCHING: 'Loading your document',
    SPOOLING: 'Sending to printer',
    SPOOLED: 'Queued at the printer',
    PRINTING: 'Printing',
    PRINTED: 'Sheets delivered',
    SHREDDING: 'Erasing your document',
    COMPLETED: 'Complete',
    FAILED: 'Print failed',
  };

  function paint(s) {
    $('job-stage').textContent = STAGE_TEXT[s.stage] || s.stage;
    $('job-msg').textContent = s.message || '';
    $('job-pct').textContent = (s.percent || 0) + '%';
    $('job-bar').querySelector('i').style.width = (s.percent || 0) + '%';
    $('job-bar').classList.toggle('err', s.stage === 'FAILED');
    if (s.driver) $('job-driver').textContent = 'driver: ' + s.driver;
  }

  async function pollJob() {
    if (!state.jobId) return;
    try {
      const r = await fetch('/api/jobs/' + state.jobId);
      if (!r.ok) throw new Error('gone');
      const s = await r.json();
      paint(s);
      if (s.done) { finish(s); return; }
    } catch { /* keep trying */ }
    setTimeout(pollJob, 1200);
  }

  /* ------------------------------- result -------------------------------- */

  const ICON_OK =
    '<circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/>';
  const ICON_BAD =
    '<circle cx="12" cy="12" r="10"/><path d="M12 7v6"/><path d="M12 16.5h.01"/>';

  function finish(s) {
    $('printer-art').classList.add('paused');
    show('done');

    const icon = $('done-icon');
    icon.innerHTML = s.succeeded ? ICON_OK : ICON_BAD;
    icon.style.color = s.succeeded ? 'var(--accent)' : 'var(--danger)';

    $('done-title').textContent = s.succeeded ? 'Collect your printout' : 'Printing failed';
    $('done-title').className = 'headline ' + (s.succeeded ? 'ok' : 'bad');
    $('done-msg').textContent = s.succeeded
      ? 'Your document has been erased from this kiosk.'
      : (s.error || 'Please try your code again, or see the desk staff.');

    fillSummary($('done-summary'), s.summary);

    let left = Math.round(state.resetDelayMs / 1000);
    const tick = () => {
      $('done-count').textContent = 'Returning to the keypad in ' + left + 's';
      if (left <= 0) reset();
      left -= 1;
    };
    tick();
    clearInterval(state.countTimer);
    state.countTimer = setInterval(tick, 1000);
  }

  function reset() {
    clearInterval(state.countTimer);
    clearTimeout(state.resetTimer);
    if (state.es) { state.es.close(); state.es = null; }
    state.otp = '';
    state.busy = false;
    state.jobId = null;
    renderCells();
    setMsg('');
    show('pad');
    bumpIdle();
  }

  $('btn-next').addEventListener('click', reset);

  /* -------------------------- idle / housekeeping ------------------------ */

  function bumpIdle() {
    clearTimeout(state.idleTimer);
    state.idleTimer = setTimeout(() => {
      if (!state.busy && state.otp.length) { state.otp = ''; renderCells(); setMsg(''); }
    }, 45000);
  }
  function clearIdle() { clearTimeout(state.idleTimer); }

  function clock() {
    const d = new Date();
    $('clock').textContent =
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  async function health() {
    try {
      const r = await fetch('/api/health');
      const h = await r.json();
      state.resetDelayMs = h.resetDelayMs || state.resetDelayMs;
      $('kiosk-id').textContent = h.kioskId;
      const p = h.printer || {};
      const dot = $('dot-printer');
      const label = $('printer-label');
      if (p.simulated) {
        dot.className = 'dot sim';
        label.textContent = 'simulation mode';
      } else if (p.activePrinter) {
        dot.className = 'dot ok';
        label.textContent = p.activePrinter;
      } else {
        dot.className = 'dot bad';
        label.textContent = 'no printer';
      }
    } catch {
      $('dot-printer').className = 'dot bad';
      $('printer-label').textContent = 'agent offline';
    }
  }

  // Suppress pinch-zoom and double-tap-zoom on the touchscreen.
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  let lastTouch = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouch < 350) e.preventDefault();
    lastTouch = now;
  }, { passive: false });

  if (new URLSearchParams(location.search).has('cursorless')) {
    document.body.classList.add('kiosk-cursorless');
  }

  renderCells();
  clock(); setInterval(clock, 15000);
  health(); setInterval(health, 20000);
  bumpIdle();
})();
</script>
</body>
</html>
